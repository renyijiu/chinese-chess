name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository and Git LFS objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Audit dependency lockfile
        run: npm audit --audit-level=high

      - name: Static and deterministic checks
        run: |
          npm run format:check
          npm run typecheck
          npm run lint
          npm run test:unit
          npm run test:runtime
          npm run test:budget

      - name: Production build and rendered HTML smoke
        run: |
          npm test
          npm run test:bundle

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production browser smoke
        run: npm run test:e2e:release

      - name: Online pairing browser flow
        run: npm run test:online:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 7
